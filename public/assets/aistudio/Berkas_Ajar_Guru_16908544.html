<style>
/* Layout: a sticky rail listing the seven files in working order, one wide workspace, and every file can be viewed as a white "paper" document that copies into Word. */

  --accent:#0E6B5A; --accent-fg:#FFFFFF; --accent-soft:#DCEFE9;
  --warn:#8F4D0A; --warn-soft:#FBEBD6; --bad:#B3261E; --bad-soft:#FBE3E0;
  --paper:#FFFFFF; --paperfg:#14181A;
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"Times New Roman",Tinos,Times,serif;
}
@media (prefers-color-scheme: dark){

    --accent:#4FC9AB; --accent-fg:#06211B; --accent-soft:#19352E;
    --warn:#E8A04D; --warn-soft:#3A2A14; --bad:#F08A82; --bad-soft:#3E1D1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#172320; --surface2:#1C2B27; --fg:#E3EDE9; --muted:#9DB0A9; --line:#2C3D38;
  --accent:#4FC9AB; --accent-fg:#06211B; --accent-soft:#19352E;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-block:20px 56px;

.chip.off{background:repeating-linear-gradient(135deg,var(--warn-soft),var(--warn-soft) 4px,var(--surface) 4px,var(--surface) 8px);border-color:var(--warn);color:var(--warn);font-weight:600}

.cprow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) auto;gap:10px;align-items:start;padding-top:12px;border-top:1px solid var(--line)}

.kkh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.intv{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.grp3{font:700 15px var(--f-display);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}

.pick{display:flex;flex-wrap:wrap;gap:6px}
.emptyst{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}

/* Document paper */
.docwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.doc{background:var(--paper);color:var(--paperfg);font:13px/1.45 var(--f-doc);padding:30px 32px;min-width:560px}
.dt{text-align:center;font:700 15px/1.3 var(--f-doc);text-transform:uppercase;margin:0}

  .pt{font-size:25px}

}
@media (prefers-reduced-motion:reduce){.meter i,#toast{transition:none}}
</style>

<script>
(function(){
'use strict';
var KEY='berkas-ajar-guru-v1';
var S=null, NOMAP={};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var nl=function(s){return String(s||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){return '<p>'+esc(l)+'</p>'}).join('')};
var dots=function(s){return esc(s)||'…………………'};
var num=function(v){return Number(v)||0};
var sum=function(a,f){return a.reduce(function(s,x){return s+f(x)},0)};
var lc=function(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s};
var inti=function(s){return String(s||'').trim().replace(/^peserta didik\s+(mampu|dapat)\s+/i,'').replace(/[.\s]+$/,'')};
var DIM=['Keimanan dan Ketakwaan kepada Tuhan YME','Kewargaan','Penalaran Kritis','Kreativitas','Kolaborasi','Kemandirian','Kesehatan','Komunikasi'];
var TABS=[{id:'mulai',l:'Beranda'},{id:'waktu',l:'Analisis Waktu',n:1},{id:'cpatp',l:'CP–ATP',n:2},{id:'prota',l:'Program Tahunan',n:3},{id:'promes',l:'Program Semester',n:4},{id:'kktp',l:'KKTP',n:5},{id:'modul',l:'Modul Ajar',n:6},{id:'lkpd',l:'LKPD',n:7}];

/* ---------- data ---------- */
function mon(sem,nama,n,off,ket){return {id:uid(),sem:sem,nama:nama,n:n,off:off||[],ket:ket||''}}
function months(o){return [
  mon(1,'Juli',3,o?[0]:[],o?'Masa Pengenalan Lingkungan Sekolah':''),
  mon(1,'Agustus',4),mon(1,'September',4),
  mon(1,'Oktober',4,o?[1]:[],o?'Asesmen sumatif tengah semester':''),
  mon(1,'November',4),
  mon(1,'Desember',3,o?[1,2]:[],o?'Asesmen sumatif akhir semester dan libur semester':''),
  mon(2,'Januari',4,o?[0]:[],o?'Libur semester':''),
  mon(2,'Februari',4),
  mon(2,'Maret',4,o?[1,2]:[],o?'Libur hari raya dan cuti bersama':''),
  mon(2,'April',4),
  mon(2,'Mei',4,o?[2]:[],o?'Asesmen sumatif tengah semester':''),
  mon(2,'Juni',3,o?[1,2]:[],o?'Asesmen sumatif akhir tahun dan libur kenaikan kelas':'')
]}
function blank(){return {v:1,sample:false,ui:{tab:'mulai',sem:1,doc:{},unit:null,unitL:null},
  profil:{guru:'',nip:'',sekolah:'',mapel:'',fase:'D',kelas:'',ta:'2026/2027',kepsek:'',nipKs:'',kota:'',tgl:'',jp:4,menit:40,b1:60,b2:75,b3:90},
  bulan:months(false),cp:[],unit:[],tp:[],promes:{},modul:{},lkpd:{}}}
function seed(){
  S=blank();S.sample=true;S.profil.mapel='Matematika';S.profil.kelas='VII';S.bulan=months(true);
  var E={};
  [['Bilangan','Peserta didik dapat membaca, menulis, dan membandingkan bilangan bulat, pecahan, serta bilangan berpangkat dan notasi ilmiah, lalu menggunakannya dalam operasi hitung dan masalah sehari-hari.'],
   ['Aljabar','Peserta didik dapat menyederhanakan bentuk aljabar serta menyelesaikan persamaan dan pertidaksamaan linear satu variabel.'],
   ['Pengukuran','Peserta didik dapat menghitung luas permukaan dan volume bangun ruang sederhana dalam konteks nyata.'],
   ['Geometri','Peserta didik dapat menjelaskan hubungan antarsudut serta menentukan keliling dan luas bangun datar.'],
   ['Analisis Data dan Peluang','Peserta didik dapat menyajikan dan menafsirkan data serta menentukan peluang kejadian sederhana.']
  ].forEach(function(c){var o={id:uid(),elemen:c[0],teks:c[1]};S.cp.push(o);E[c[0]]=o.id});
  function U(sem,nama,el,tps){var u={id:uid(),sem:sem,nama:nama,cpId:E[el]};S.unit.push(u);
    tps.forEach(function(t){S.tp.push({id:uid(),unitId:u.id,teks:'Peserta didik dapat '+t[0],jp:t[1],ind:'',r1:'',r2:'',r3:'',r4:'',teknik:''})});return u}
  var u1=U(1,'Bilangan Bulat dan Pecahan','Bilangan',[['membaca, menulis, dan membandingkan bilangan bulat serta pecahan',8],['melakukan operasi hitung bilangan bulat dan pecahan dalam masalah sehari-hari',12]]);
  U(1,'Bilangan Berpangkat dan Notasi Ilmiah','Bilangan',[['menjelaskan sifat-sifat bilangan berpangkat bulat',8],['menuliskan bilangan sangat besar dan sangat kecil dalam notasi ilmiah',8]]);
  U(1,'Bentuk Aljabar dan Persamaan Linear','Aljabar',[['menyederhanakan bentuk aljabar',12],['menyelesaikan persamaan dan pertidaksamaan linear satu variabel',16]]);
  U(2,'Sudut dan Bangun Datar','Geometri',[['menjelaskan hubungan antarsudut pada garis sejajar dan garis yang memotongnya',10],['menentukan keliling dan luas segitiga serta segiempat',14]]);
  U(2,'Bangun Ruang','Pengukuran',[['menghitung luas permukaan dan volume prisma dan tabung',16]]);
  U(2,'Statistika dan Peluang','Analisis Data dan Peluang',[['menyajikan dan menafsirkan data dengan diagram dan ukuran pemusatan',14],['menentukan peluang kejadian sederhana',10]]);
  S.tp.slice(0,3).forEach(function(t){fillEmpty(t,genKktp(t))});
  autoSebar(1);autoSebar(2);
  S.modul[u1.id]=fillEmpty({},genModul(u1));
  S.lkpd[u1.id]=fillEmpty({},genLkpd(u1));
  S.ui.unit=u1.id;S.ui.unitL=u1.id;
}
function fillEmpty(o,g){for(var k in g){var v=o[k];if(v==null||v===''||(Array.isArray(v)&&!v.length))o[k]=g[k]}return o}

/* ---------- derived ---------- */
var bul=function(id){return S.bulan.find(function(b){return b.id===id})};
var bulanSem=function(s){return S.bulan.filter(function(b){return b.sem===s})};
var mgEf=function(b){return b.n-b.off.length};
function orderedTps(s){var out=[];S.unit.filter(function(u){return u.sem===s}).forEach(function(u){S.tp.filter(function(t){return t.unitId===u.id}).forEach(function(t){out.push(t)})});return out}
var jpTotal=function(s){return sum(orderedTps(s),function(t){return num(t.jp)})};
var jpAvail=function(s){return sum(bulanSem(s),function(b){return mgEf(b)*num(S.profil.jp)})};
function slots(s){var r=[];bulanSem(s).forEach(function(b){for(var w=0;w<b.n;w++)if(b.off.indexOf(w)<0)r.push(b.id+':'+w)});return r}
function autoSebar(s){
  var sl=slots(s),jp=num(S.profil.jp)||1,cur=0,over=0;
  orderedTps(s).forEach(function(t){var j=num(t.jp),set=[];
    if(j>0){var a=Math.floor(cur/jp),b=Math.ceil((cur+j)/jp)-1;for(var i=a;i<=b;i++){if(sl[i])set.push(sl[i]);else over++}}
    S.promes[t.id]=set;cur+=j});
  return over}
function lv(){var p=S.profil,b1=num(p.b1),b2=num(p.b2),b3=num(p.b3);
  return [['Perlu Bimbingan','0–'+b1],['Cukup',(b1+1)+'–'+b2],['Baik',(b2+1)+'–'+b3],['Sangat Baik',(b3+1)+'–100']]}
var no=function(id){return NOMAP[id]||'–'};
function mapNo(){NOMAP={};orderedTps(1).concat(orderedTps(2)).forEach(function(t,i){NOMAP[t.id]=i+1})}
var unitTps=function(u){return S.tp.filter(function(t){return t.unitId===u.id})};
var unitJp=function(u){return sum(unitTps(u),function(t){return num(t.jp)})};

function ratioSt(r){return r<=0?0:r>=1?2:1}
function status(id){
  var n=S.tp.length,p=S.profil,U=S.unit.length;
  switch(id){
    case 'mulai':{var f=['guru','sekolah','mapel','kelas','ta','kepsek'];return ratioSt(f.filter(function(k){return p[k]}).length/f.length)}
    case 'waktu':return jpAvail(1)>0&&jpAvail(2)>0?2:(jpAvail(1)>0||jpAvail(2)>0?1:0);
    case 'cpatp':{var r=n?S.tp.filter(function(t){return t.teks&&num(t.jp)>0}).length/n:0;return ratioSt(S.cp.length?r:Math.min(r,.5))}
    case 'prota':return !n?0:(jpTotal(1)<=jpAvail(1)&&jpTotal(2)<=jpAvail(2)?2:1);
    case 'promes':return ratioSt(n?S.tp.filter(function(t){return (S.promes[t.id]||[]).length}).length/n:0);
    case 'kktp':return ratioSt(n?S.tp.filter(function(t){return t.ind&&t.r1&&t.r2&&t.r3&&t.r4}).length/n:0);
    case 'modul':return ratioSt(U?S.unit.filter(function(u){var m=S.modul[u.id];return m&&m.pendahuluan&&m.memahami}).length/U:0);
    case 'lkpd':return ratioSt(U?S.unit.filter(function(u){var l=S.lkpd[u.id];return l&&l.tugas}).length/U:0);
  }return 0}
function detail(id){
  var n=S.tp.length,U=S.unit.length;
  switch(id){
    case 'mulai':return 'Identitas guru dan sekolah';
    case 'waktu':return (mgSum(1)+mgSum(2))+' minggu efektif · '+(jpAvail(1)+jpAvail(2))+' JP';
    case 'cpatp':return U+' unit · '+n+' TP';
    case 'prota':return (jpTotal(1)+jpTotal(2))+' JP materi';
    case 'promes':return S.tp.filter(function(t){return (S.promes[t.id]||[]).length}).length+' dari '+n+' TP terjadwal';
    case 'kktp':return S.tp.filter(function(t){return t.ind&&t.r1&&t.r2&&t.r3&&t.r4}).length+' dari '+n+' TP lengkap';
    case 'modul':return S.unit.filter(function(u){var m=S.modul[u.id];return m&&m.pendahuluan&&m.memahami}).length+' dari '+U+' unit';
    case 'lkpd':return S.unit.filter(function(u){var l=S.lkpd[u.id];return l&&l.tugas}).length+' dari '+U+' unit';
  }return ''}
var mgSum=function(s){return sum(bulanSem(s),mgEf)};
var STL=['Belum','Sebagian','Selesai'];
function calc(key){
  var q=key.split(':'),k=q[0],a=q[1],p=num(S.profil.jp);
  switch(k){
    case 'mgef':{var b=bul(a);return b?String(mgEf(b)):''}
    case 'jpef':{var b2=bul(a);return b2?String(mgEf(b2)*p):''}
    case 'semsum':{var s=+a,bs=bulanSem(s),w=sum(bs,function(x){return x.n}),o=sum(bs,function(x){return x.off.length});return w+' minggu · '+o+' tidak efektif · '+(w-o)+' efektif · '+(w-o)*p+' JP'}
    case 'unitjp':{var u=S.unit.find(function(x){return x.id===a});return u?unitJp(u)+' JP di unit ini':''}
    case 'semjp':return jpTotal(+a)+' JP materi dari '+jpAvail(+a)+' JP efektif';
    case 'sisa':{var d=jpAvail(+a)-jpTotal(+a);return d>=0?'Sisa '+d+' JP untuk asesmen, remedial, dan cadangan.':'Kelebihan '+(-d)+' JP. Kurangi materi atau tambah minggu efektif.'}
    case 'pstat':{var s2=+a,sl=slots(s2).length,used={};orderedTps(s2).forEach(function(t){(S.promes[t.id]||[]).forEach(function(x){used[x]=1})});return Object.keys(used).length+' dari '+sl+' minggu efektif terisi'}
  }return ''}
function updateDerived(){
  document.querySelectorAll('[data-calc]').forEach(function(e){var v=calc(e.dataset.calc);if(e.textContent!==v)e.textContent=v});
  document.querySelectorAll('[data-meter]').forEach(function(e){var s=+e.dataset.meter,a=jpAvail(s),t=jpTotal(s);e.style.width=(a?Math.min(100,t/a*100):(t?100:0))+'%';e.classList.toggle('over',t>a)});
  renderNav()}
function renderNav(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button class="navbtn" data-act="tab" data-v="'+t.id+'" data-s="'+status(t.id)+'"'+(S.ui.tab===t.id?' aria-current="page"':'')+'><span class="step">'+(t.n||'⌂')+'</span><span>'+t.l+'</span></button>'}).join('');
  var p=S.profil;$('#brandsub').textContent=[p.mapel,p.fase?'Fase '+p.fase:'',p.kelas?'Kelas '+p.kelas:'',p.ta?'TP '+p.ta:''].filter(Boolean).join(' · ')||'Perangkat ajar Kurikulum Merdeka'}

  refGuru:'1. Apakah tujuan pembelajaran tercapai?\n2. Bagian mana yang perlu diperbaiki?\n3. Peserta didik mana yang perlu tindak lanjut?',

  pustaka:'Isi dengan judul buku teks utama, penulis, penerbit, dan tahun terbit.'}}

  '<label class="f ue"><span>Elemen</span><select class="in" data-c="unit" data-id="'+u.id+'" data-f="cpId"><option value="">—</option>'+S.cp.map(function(c){return '<option value="'+c.id+'"'+(c.id===u.cpId?' selected':'')+'>'+esc(c.elemen)+'</option>'}).join('')+'</select></label>'+
  '<label class="f us"><span>Semester</span><select class="in" data-c="unit" data-id="'+u.id+'" data-f="sem" data-n data-rr><option value="1"'+(u.sem===1?' selected':'')+'>1</option><option value="2"'+(u.sem===2?' selected':'')+'>2</option></select></label></div>'+

  '<button class="btn sm ghost" data-act="upunit" data-id="'+u.id+'" aria-label="Naikkan unit">↑</button><button class="btn sm ghost" data-act="downunit" data-id="'+u.id+'" aria-label="Turunkan unit">↓</button><button class="btn sm ghost" data-act="delunit" data-id="'+u.id+'" data-arm="1">Hapus unit</button></div></div>'}
function cpatpEdit(){

   S.cp.map(function(c){return '<div class="cprow"><label class="f"><span>Elemen</span><input class="in" data-c="cp" data-id="'+c.id+'" data-f="elemen" value="'+esc(c.elemen)+'"></label><label class="f"><span>Capaian pembelajaran</span><textarea class="in" rows="3" data-c="cp" data-id="'+c.id+'" data-f="teks">'+esc(c.teks)+'</textarea></label><button class="btn sm ghost" data-act="delcp" data-id="'+c.id+'" data-arm="1">Hapus</button></div>'}).join('')+
   '<div><button class="btn sm" data-act="addcp">Tambah elemen</button></div></section>';
  var alur=[1,2].map(function(s){var us=S.unit.filter(function(u){return u.sem===s});
    return '<section class="card"><div class="semh2"><h3>Alur Tujuan Pembelajaran · Semester '+s+'</h3><span class="semsum" data-calc="semjp:'+s+'"></span></div>'+
    (us.map(unitBlock).join('')||'<p class="empty">Belum ada unit di semester ini.</p>')+'<div><button class="btn sm" data-act="addunit" data-s="'+s+'">Tambah unit</button></div></section>'}).join('');
  return cps+alur}
function spans(rows,f){var out=[],i=0;while(i<rows.length){var j=i;while(j<rows.length&&f(rows[j])===f(rows[i]))j++;out[i]=j-i;for(var k=i+1;k<j;k++)out[k]=0;i=j}return out}
function cpatpDoc(){
  var rows=[];[1,2].forEach(function(s){orderedTps(s).forEach(function(t){var u=S.unit.find(function(x){return x.id===t.unitId});rows.push({t:t,u:u,s:s,cp:S.cp.find(function(c){return c.id===u.cpId})})})});
  if(!rows.length)return docFrame('CAPAIAN PEMBELAJARAN DAN ALUR TUJUAN PEMBELAJARAN','<p class="dnote">Belum ada tujuan pembelajaran.</p>');
  var spE=spans(rows,function(r){return r.cp?r.cp.id:'-'}),spU=spans(rows,function(r){return r.u.id});
  var body='<table class="dtbl" border="1" cellpadding="4" cellspacing="0"><thead><tr><th>Elemen</th><th>Capaian Pembelajaran</th><th>Lingkup Materi</th><th>Alur Tujuan Pembelajaran</th><th>JP</th><th>Smt</th></tr></thead><tbody>'+
   rows.map(function(r,i){return '<tr>'+(spE[i]?'<td rowspan="'+spE[i]+'">'+esc(r.cp?r.cp.elemen:'')+'</td><td rowspan="'+spE[i]+'">'+esc(r.cp?r.cp.teks:'')+'</td>':'')+(spU[i]?'<td rowspan="'+spU[i]+'">'+esc(r.u.nama)+'</td>':'')+'<td>'+no(r.t.id)+'. '+esc(r.t.teks)+'</td><td class="c">'+num(r.t.jp)+'</td><td class="c">'+r.s+'</td></tr>'}).join('')+'</tbody></table>';
  return docFrame('CAPAIAN PEMBELAJARAN DAN ALUR TUJUAN PEMBELAJARAN',body)}
function viewCpatp(){
  var h=head('CP dan ATP','Tuliskan capaian pembelajaran per elemen, lalu susun alur tujuan pembelajaran (ATP) per semester. Semua berkas lain membaca data ini.','cpatp');
  return h+(S.ui.doc.cpatp?cpatpDoc():cpatpEdit())}

    S.unit.filter(function(u){return u.sem===s}).forEach(function(u){var tps=unitTps(u);

  var meters=[1,2].map(function(s){return '<div class="jpm" style="flex:1 1 240px"><div class="jph"><b>Semester '+s+'</b><span data-calc="semjp:'+s+'"></span></div><div class="meter"><i data-meter="'+s+'"></i></div><p class="hint" data-calc="sisa:'+s+'"></p></div>'}).join('');
  return h+'<section class="card" style="flex-direction:row;flex-wrap:wrap;gap:20px">'+meters+'</section>'+docFrame('PROGRAM TAHUNAN',body)}

function viewPromes(){
  var s=S.ui.sem===2?2:1,bs=bulanSem(s),tps=orderedTps(s);
  var h=head('Program Semester','Letakkan setiap tujuan pembelajaran pada minggu efektif. Klik sel untuk menandai atau menghapus. Minggu tidak efektif dari Analisis Waktu sudah diarsir.','promes',{noToggle:true,extra:''});
  var ctl='<div class="bar"><div class="seg" role="group" aria-label="Semester"><button data-act="semsel" data-v="1" aria-pressed="'+(s===1)+'">Semester 1</button><button data-act="semsel" data-v="2" aria-pressed="'+(s===2)+'">Semester 2</button></div><button class="btn" data-act="sebar" data-arm="1" data-armtext="Timpa jadwal?">Sebar otomatis</button><button class="btn ghost" data-act="pkosong" data-arm="1" data-armtext="Kosongkan?">Kosongkan jadwal</button><span class="hint" data-calc="pstat:'+s+'"></span></div>';
  if(!tps.length)return h+ctl+empty('Belum ada tujuan pembelajaran di semester '+s+'. Susun alurnya di CP–ATP.','cpatp','Buka CP–ATP');
  var cols=sum(bs,function(b){return b.n});
  var h1=bs.map(function(b){return '<th colspan="'+b.n+'">'+esc(b.nama)+'</th>'}).join('');
  var h2=bs.map(function(b){var x='';for(var i=0;i<b.n;i++)x+='<th class="wk">'+(i+1)+'</th>';return x}).join('');
  var rows='',lastU=null,k=0;
  tps.forEach(function(t){var u=S.unit.find(function(x){return x.id===t.unitId});
    if(u.id!==lastU){rows+='<tr class="grp"><td colspan="'+(3+cols)+'">'+esc(u.nama)+'</td></tr>';lastU=u.id}
    k++;var set=S.promes[t.id]||[];
    rows+='<tr><td class="c">'+k+'</td><td class="stk">'+esc(t.teks)+'</td><td class="c">'+num(t.jp)+'</td>'+
    bs.map(function(b){var x='';for(var i=0;i<b.n;i++){var key=b.id+':'+i;
      if(b.off.indexOf(i)>=0)x+='<td class="pc off">L</td>';
      else{var on=set.indexOf(key)>=0;x+='<td class="pc'+(on?' on':'')+'"><button class="pcb" data-act="pc" data-id="'+t.id+'" data-k="'+key+'" aria-pressed="'+on+'" aria-label="TP '+no(t.id)+', '+esc(b.nama)+' minggu '+(i+1)+'">'+(on?'✓':'')+'</button></td>'}}return x}).join('')+'</tr>'});
  var ket=bs.filter(function(b){return b.off.length}).map(function(b){return esc(b.nama)+(b.ket?' ('+esc(b.ket)+')':'')+': minggu '+b.off.map(function(i){return i+1}).join(', ')}).join('; ');
  var body='<table class="dtbl" border="1" cellpadding="0" cellspacing="0"><thead><tr><th rowspan="2">No</th><th class="stk" rowspan="2">Tujuan Pembelajaran</th><th rowspan="2">JP</th>'+h1+'</tr><tr>'+h2+'</tr></thead><tbody>'+rows+
   '<tr class="tot"><td colspan="3">Jumlah JP</td><td colspan="'+cols+'">'+jpTotal(s)+' JP</td></tr></tbody></table><p class="dnote">✓ = minggu pembelajaran. L = minggu tidak efektif.'+(ket?' Minggu tidak efektif — '+ket+'.':'')+'</p>';
  return h+ctl+docFrame('PROGRAM SEMESTER '+s,body,{sub:'Semester '+(s===1?'Ganjil':'Genap')+' Tahun Pelajaran '+dots(S.profil.ta)})}

  var lines=function(s){return String(s||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)};
  var body='<table class="dtbl" border="1" cellpadding="6" cellspacing="0"><tr><td style="width:28%">Nama kelompok</td><td>&nbsp;</td></tr><tr><td>Anggota</td><td>&nbsp;<br>&nbsp;<br>&nbsp;</td></tr><tr><td>Kelas / Tanggal</td><td>&nbsp;</td></tr></table>'+
   (l.tujuan?'<h4>Tujuan pembelajaran</h4>'+nl(l.tujuan):'')+(l.petunjuk?'<h4>Petunjuk belajar</h4>'+nl(l.petunjuk):'')+(l.alat?'<h4>Alat dan bahan</h4>'+nl(l.alat):'')+(l.kegiatan?'<h4>Langkah kegiatan</h4>'+nl(l.kegiatan):'')+
   '<h4>Tugas</h4>'+(lines(l.tugas).map(function(t){return '<p><b>'+esc(t)+'</b></p>'+ans(n)}).join('')||'<p>Belum ada tugas.</p>')+
   '<h4>Kesimpulan</h4><p>'+esc(l.kesimpulan||'')+'</p>'+ans(Math.min(n,3))+
   '<h4>Refleksi</h4><p>'+esc(l.refleksi||'')+'</p><p>Aku sudah paham <span class="lvl-box"></span> &nbsp; Aku masih perlu latihan <span class="lvl-box"></span> &nbsp; Aku belum paham <span class="lvl-box"></span></p>'+
   '<h4>Penilaian guru</h4><p>'+L.map(function(x){return x[0]+' ('+x[1]+') <span class="lvl-box"></span>'}).join(' &nbsp; ')+'</p>';
  return docFrame('LEMBAR KERJA PESERTA DIDIK (LKPD)',body,{sub:esc(l.judul||('LKPD '+u.nama)),extra:['Unit',esc(u.nama)]})}
function viewLkpd(){return unitTabView('unitL','unitselL','LKPD','Lembar kerja untuk setiap unit. Tujuan dan tugas diturunkan dari tujuan pembelajaran unit, lalu dapat Anda tulis ulang sesuai kegiatan kelas.','lkpd',lkpdEdit,lkpdDoc,'genl','Isi kerangka LKPD')}

/* ---------- render / state ---------- */
function render(){
  mapNo();
  var v={mulai:viewMulai,waktu:viewWaktu,cpatp:viewCpatp,prota:viewProta,promes:viewPromes,kktp:viewKktp,modul:viewModul,lkpd:viewLkpd}[S.ui.tab]||viewMulai;
  $('#main').innerHTML=notice()+v();
  updateDerived()}
var saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(function(){var el=$('#saved');try{localStorage.setItem(KEY,JSON.stringify(S));el.textContent='Tersimpan di peramban ini'}catch(e){el.textContent='Penyimpanan peramban tidak tersedia. Salin cadangan dari Beranda.'}},250)}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.profil&&o.bulan&&o.tp&&o.unit)return o}}catch(e){}return null}
var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},3200)}
function obj(c,id){if(c==='profil')return S.profil;if(c==='modul'||c==='lkpd')return S[c][id]||(S[c][id]={});return S[c].find(function(x){return x.id===id})}
function setField(el,final){
  var c=el.dataset.c,id=el.dataset.id,f=el.dataset.f,v=el.value;
  if(el.dataset.n!==undefined)v=v===''?0:Number(v);
  var o=obj(c,id);if(!o)return;
  o[f]=v;
  if(c==='bulan'&&f==='n'){var n=Math.max(1,Math.min(6,Math.round(num(v))||1));o.n=n;o.off=o.off.filter(function(i){return i<n});
    var ch=document.querySelector('[data-chips="'+id+'"]');if(ch)ch.innerHTML=chips(o);if(final)el.value=n}
  persist();updateDerived()}
function move(arr,id,dir,pred){var idx=[];arr.forEach(function(x,i){if(pred(x))idx.push(i)});var p=-1;idx.forEach(function(i,k){if(arr[i].id===id)p=k});var q=p+dir;if(p<0||q<0||q>=idx.length)return;var a=idx[p],b=idx[q],t=arr[a];arr[a]=arr[b];arr[b]=t}
function dropUnit(id){var ids=S.tp.filter(function(t){return t.unitId===id}).map(function(t){return t.id});ids.forEach(function(x){delete S.promes[x]});S.tp=S.tp.filter(function(t){return t.unitId!==id});S.unit=S.unit.filter(function(u){return u.id!==id});delete S.modul[id];delete S.lkpd[id]}
function newTp(unitId){return {id:uid(),unitId:unitId,teks:'Peserta didik dapat ',jp:4,ind:'',r1:'',r2:'',r3:'',r4:'',teknik:''}}

async function copyDoc(){
  var el=document.getElementById('doc');if(!el)return;
  var c=el.cloneNode(true);
  c.querySelectorAll('button').forEach(function(b){b.replaceWith(document.createTextNode(b.textContent.trim()))});
  c.querySelectorAll('.pc.on').forEach(function(td){td.setAttribute('style','background:#0E6B5A;color:#ffffff;text-align:center')});
  c.querySelectorAll('.pc.off').forEach(function(td){td.setAttribute('style','background:#d4d4d4;text-align:center')});
  c.querySelectorAll('.dtbl').forEach(function(t){t.setAttribute('style','border-collapse:collapse;width:100%')});
  var html='<div style="font-family:Times New Roman,serif;font-size:12pt">'+c.innerHTML+'</div>',text=el.innerText;
  try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
    toast('Dokumen disalin. Tempel di Word atau Google Docs.');return}}catch(e){}
  try{await navigator.clipboard.writeText(text);toast('Teks dokumen disalin tanpa format tabel.');return}catch(e){}
  var r=document.createRange();r.selectNodeContents(el);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  toast('Dokumen sudah terpilih. Tekan Ctrl+C untuk menyalin.')}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg);return}catch(e){}
  var ta=$('#bk');if(ta){ta.focus();ta.select();toast('Teks terpilih. Tekan Ctrl+C untuk menyalin.')}}

document.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.f)setField(el,false)});
document.addEventListener('change',function(e){var el=e.target;if(!el.dataset||!el.dataset.f)return;setField(el,true);if(el.dataset.rr!==undefined)render()});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.dataset.arm&&!b.classList.contains('armed')){b.classList.add('armed');b.dataset.t=b.textContent;b.textContent=b.dataset.armtext||'Yakin?';
    setTimeout(function(){if(b.isConnected&&b.classList.contains('armed')){b.classList.remove('armed');b.textContent=b.dataset.t}},3000);return}
  var a=b.dataset.act,id=b.dataset.id,v=b.dataset.v,done=function(r){persist();if(r!==false)render()};
  switch(a){
    case 'tab':S.ui.tab=v;done();window.scrollTo({top:0});var cur=$('.navbtn[aria-current="page"]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({inline:'center',block:'nearest'});break;
    case 'view':S.ui.doc[S.ui.tab]=v==='doc';done();break;
    case 'semsel':S.ui.sem=+v;done();break;
    case 'unitsel':S.ui.unit=id;done();break;
    case 'unitselL':S.ui.unitL=id;done();break;
    case 'addcp':S.cp.push({id:uid(),elemen:'',teks:''});done();break;
    case 'delcp':S.cp=S.cp.filter(function(c){return c.id!==id});S.unit.forEach(function(u){if(u.cpId===id)u.cpId=''});done();break;
    case 'addunit':{var u={id:uid(),sem:+b.dataset.s,nama:'',cpId:S.cp[0]?S.cp[0].id:''};S.unit.push(u);S.tp.push(newTp(u.id));done();break}
    case 'delunit':dropUnit(id);done();break;
    case 'upunit':case 'downunit':{var uu=S.unit.find(function(x){return x.id===id});if(uu)move(S.unit,id,a==='upunit'?-1:1,function(x){return x.sem===uu.sem});done();break}
    case 'addtp':S.tp.push(newTp(id));done();break;
    case 'deltp':S.tp=S.tp.filter(function(t){return t.id!==id});delete S.promes[id];done();break;
    case 'uptp':case 'downtp':{var tt=S.tp.find(function(x){return x.id===id});if(tt)move(S.tp,id,a==='uptp'?-1:1,function(x){return x.unitId===tt.unitId});done();break}
    case 'addbulan':S.bulan.push({id:uid(),sem:+b.dataset.s,nama:'',n:4,off:[],ket:''});done();break;
    case 'delbulan':S.bulan=S.bulan.filter(function(x){return x.id!==id});done();break;
    case 'wk':{var bb=bul(id),i=+b.dataset.i,p=bb.off.indexOf(i);if(p>=0)bb.off.splice(p,1);else bb.off.push(i);
      var ch=document.querySelector('[data-chips="'+id+'"]');if(ch)ch.innerHTML=chips(bb);persist();updateDerived();break}
    case 'pc':{var set=S.promes[id]||(S.promes[id]=[]),k=b.dataset.k,pos=set.indexOf(k);if(pos>=0)set.splice(pos,1);else set.push(k);
      var on=pos<0;b.setAttribute('aria-pressed',on);b.textContent=on?'✓':'';b.parentElement.classList.toggle('on',on);persist();updateDerived();break}
    case 'sebar':{var over=autoSebar(S.ui.sem===2?2:1);done();toast(over?'Sebagian TP melebihi minggu efektif. Kurangi JP atau tambah minggu.':'Jadwal tersebar ke minggu efektif sesuai JP.');break}
    case 'pkosong':orderedTps(S.ui.sem===2?2:1).forEach(function(t){S.promes[t.id]=[]});done();break;
    case 'genk':{var t1=S.tp.find(function(x){return x.id===id});if(t1)fillEmpty(t1,genKktp(t1));done();break}
    case 'genkall':S.tp.forEach(function(t){fillEmpty(t,genKktp(t))});done();toast('Kerangka KKTP terisi untuk bagian yang kosong.');break;
    case 'genm':{var um=curUnit('unit');S.modul[um.id]=fillEmpty(S.modul[um.id]||{},genModul(um));done();toast('Kerangka modul terisi.');break}
    case 'genl':{var ul=curUnit('unitL');S.lkpd[ul.id]=fillEmpty(S.lkpd[ul.id]||{},genLkpd(ul));done();toast('Kerangka LKPD terisi.');break}
    case 'dim':{var m=obj('modul',id),arr=m.dimensi||(m.dimensi=[]),q=arr.indexOf(v);if(q>=0)arr.splice(q,1);else arr.push(v);b.setAttribute('aria-pressed',q<0);persist();updateDerived();break}
    case 'copy':copyDoc();break;
    case 'keepsample':S.sample=false;done();break;
    case 'resetall':S=blank();done();toast('Data dikosongkan.');break;
    case 'backup':copyText(JSON.stringify(S),'Cadangan disalin. Simpan di tempat aman.');break;
    case 'restore':{try{var o=JSON.parse($('#bk').value);if(!(o&&o.profil&&o.bulan&&o.tp&&o.unit))throw 0;o.ui=o.ui||{tab:'mulai',sem:1,doc:{}};S=o;done();toast('Data dipulihkan dari cadangan.')}catch(err){toast('Cadangan tidak valid. Tempel isi cadangan yang utuh.')}break}
  }
});

S=load();
if(!S){seed();persist()}
render();
setTimeout(function(){var el=$('#saved');if(el&&!el.textContent)el.textContent='Perubahan disimpan otomatis di peramban ini'},0);
})();
</script>

</body></html>
